<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ site_name|default('Đọc Truyện') }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  {# Apply saved theme / font size before first paint to avoid a flash #}
  <script>try{var s=JSON.parse(localStorage.getItem('reader')||'{}'),d=document.documentElement;if(s.theme)d.dataset.theme=s.theme;if(s.size)d.style.setProperty('--read-size',s.size+'px')}catch(e){}</script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="site-header">
    <a class="brand" href="{{ url_for('get_all_books') }}">{{ site_name|default('Đọc Truyện') }}</a>
  </header>
  {% endblock %}

  <main id="main">{% block content %}{% endblock %}</main>

  {% block scripts %}{% endblock %}
</body>
</html>
